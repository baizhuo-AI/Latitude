# Empty keys are not accounted, so GET polling/readback remains unaffected.
map $request_method $latitude_agent_write_key {
    default "";
    POST $binary_remote_addr;
}

map $request_method $latitude_domain_write_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $latitude_agent_write_key zone=latitude_agent_write:10m rate=12r/m;
limit_req_zone $latitude_domain_write_key zone=latitude_domain_write:10m rate=60r/m;
