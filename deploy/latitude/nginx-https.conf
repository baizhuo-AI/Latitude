server {
    listen 80;
    listen [::]:80;
    server_name latitude.baizhuo.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://latitude.baizhuo.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name latitude.baizhuo.online;

    root /opt/latitude/current/web;
    index index.html;
    client_max_body_size 70m;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/latitude.baizhuo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/latitude.baizhuo.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location ^~ /api/agent/ {
        limit_req zone=latitude_agent_write burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:43120/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ^~ /api/domain/ {
        limit_req zone=latitude_domain_write burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:43121/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Public demo traffic never gets bulk export, restore, reset or purge.
    # These remain available only from the server's loopback services.
    location ^~ /api/agent/v1/agent/admin/ {
        return 403;
    }

    location ^~ /api/domain/v1/admin/ {
        return 403;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
