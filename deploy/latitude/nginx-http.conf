server {
    listen 80;
    listen [::]:80;
    server_name latitude.baizhuo.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://latitude.baizhuo.online$request_uri;
    }
}
